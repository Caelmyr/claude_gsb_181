<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>结果导出 Results — 分布式 MapReduce</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="app-nav"></header>
  <main class="page">
    <h1 class="page-title">结果查看与导出 <span>Results &amp; Export</span></h1>
    <p class="page-desc">查看各分区结果并导出 JSON / CSV。Inspect partition results and export as JSON / CSV.</p>

    <div class="flex between mb">
      <div id="job-picker" style="min-width:280px"></div>
      <div class="flex">
        <a class="btn primary small" id="dl-json" href="#">导出 JSON</a>
        <a class="btn small" id="dl-csv" href="#">导出 CSV</a>
      </div>
    </div>

    <div class="stat-tiles" id="stats"></div>
    <div class="grid cols-2 mt">
      <div class="card"><h2>结果分区 <span class="sub">Partitions</span></h2><div id="partitions"></div></div>
      <div class="card"><h2>结果预览 <span class="sub">Preview</span></h2><div id="preview"></div></div>
    </div>

    <div class="card mt compare-card">
      <div class="flex between compare-head">
        <div>
          <h2>作业结果并排对比 <span class="sub">Side-by-side diff</span></h2>
          <p class="page-desc compact">按记录标识对齐；忽略分区数、规模和输出顺序，重复标识按多集合匹配。</p>
        </div>
        <button class="btn primary small" id="compare-run">对比 Compare</button>
      </div>
      <div class="compare-pickers">
        <label>作业 A / Left<div id="compare-left-picker"></div></label>
        <label>作业 B / Right<div id="compare-right-picker"></div></label>
        <label>标识字段 Key field<input id="compare-key-field" type="text" value="key"></label>
        <label>数值容差 Tolerance<input id="compare-tolerance" type="number" min="0" step="0.0001" value="0"></label>
      </div>
      <div class="compare-filters">
        <input id="compare-q" class="input" type="search" placeholder="搜索记录标识 Search key…">
        <label><input type="checkbox" value="changed" checked> 数值不同</label>
        <label><input type="checkbox" value="left_only" checked> 仅 A 有</label>
        <label><input type="checkbox" value="right_only" checked> 仅 B 有</label>
        <label><input type="checkbox" value="duplicate" checked> 标识重复</label>
      </div>
      <div id="compare-stats" class="stat-tiles compact"></div>
      <div id="compare-results" class="mt"></div>
      <div id="compare-pager" class="pager"></div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/results.js"></script>
</body>
</html>
